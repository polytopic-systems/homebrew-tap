name: CI

on:
  push:
  pull_request:
  schedule:
    # Mondays 14:17 UTC: catch a release whose cask bump was skipped.
    - cron: "17 14 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HOMEBREW_NO_ANALYTICS: 1
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_ENV_HINTS: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1
  TAP: polytopic-systems/tap

jobs:
  check:
    name: Style, audit, install and uninstall (${{ matrix.cask }})
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    # Apple silicon, macOS 26: the casks have `depends_on arch: :arm64` and
    # `depends_on macos: :tahoe`, so they cannot install on anything older.
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # One entry per cask in Casks/: its token and the app it installs.
          - cask: live-transcript
            app: "Live Transcript.app"
          - cask: tattle
            app: "Tattle.app"
    env:
      CASK: polytopic-systems/tap/${{ matrix.cask }}
      APP: /Applications/${{ matrix.app }}
    steps:
      - name: Check out the tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Homebrew with this checkout as the tap
        run: |
          brew update --quiet
          brew --version
          sw_vers
          uname -m
          taps="$(brew --repository)/Library/Taps/polytopic-systems"
          mkdir -p "$taps"
          rm -rf "$taps/homebrew-tap"
          ln -s "$GITHUB_WORKSPACE" "$taps/homebrew-tap"
          # Third-party taps need explicit trust since Homebrew 6.
          brew trust "$TAP"

      - name: Style
        run: brew style --cask "$CASK"

      - name: Audit
        run: brew audit --cask --strict --online "$CASK"

      - name: Install
        run: brew install --cask "$CASK"

      - name: Check the installed app
        run: |
          test -d "$APP"
          brew list --cask --versions "${{ matrix.cask }}"
          codesign --verify --deep --strict --verbose=2 "$APP"
          spctl --assess --type execute --verbose=4 "$APP"
          xcrun stapler validate "$APP"

      # Tattle's uninstall runs the app's --deactivate-extension switch first. The extension was never activated
      # on this runner, so the switch must find nothing to do and exit 0 at once: a hang here points at the app.
      - name: Uninstall
        timeout-minutes: 10
        run: |
          brew uninstall --cask "$CASK"
          if test -e "$APP"; then
            echo "::error::${{ matrix.app }} is still in /Applications after uninstall"
            exit 1
          fi
          if brew list --cask "${{ matrix.cask }}" >/dev/null 2>&1; then
            echo "::error::Homebrew still lists ${{ matrix.cask }} after uninstall"
            exit 1
          fi

  livecheck:
    name: Livecheck against the Sparkle feed (${{ matrix.cask }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        cask:
          - live-transcript
          - tattle
    env:
      CASK: polytopic-systems/tap/${{ matrix.cask }}
    steps:
      - name: Check out the tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Homebrew with this checkout as the tap
        run: |
          brew update --quiet
          taps="$(brew --repository)/Library/Taps/polytopic-systems"
          mkdir -p "$taps"
          rm -rf "$taps/homebrew-tap"
          ln -s "$GITHUB_WORKSPACE" "$taps/homebrew-tap"
          brew trust "$TAP"

      - name: Fail if the feed is ahead of the cask
        run: |
          brew livecheck --cask "$CASK"
          result="$(brew livecheck --cask --json "$CASK")"
          echo "$result"
          current="$(jq -r '.[0].version.current // empty' <<<"$result")"
          latest="$(jq -r '.[0].version.latest // empty' <<<"$result")"
          outdated="$(jq -r '.[0].version.outdated // empty' <<<"$result")"
          if [ -z "$latest" ] || [ -z "$outdated" ]; then
            echo "::error::livecheck could not read a version from the feed"
            exit 1
          fi
          if [ "$outdated" = "true" ]; then
            echo "::error::The feed has $latest but the cask has $current. Bump Casks/${{ matrix.cask }}.rb."
            exit 1
          fi
          echo "Cask $current matches the feed ($latest)."
